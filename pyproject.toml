[project]
name = "incident-resolver"
version = "0.1.0"
description = "Agentic incident diagnosis system — baseline vs advanced, benchmarked."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
